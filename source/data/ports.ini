[gzdoom-rt]
Name = GZDoom Ray Traced
Exe = gzdoom-mod.exe
Cmd = -rtnolauncher +rt_mod_compat 3 +r_drawvoxels 1 -config %config% -savedir %savedir% -shotdir %shotdir%
Default = gzdoom-rt
Info = требуется музыка

