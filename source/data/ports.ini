[gzdoom]
Name = GZDoom
Exe = gzdoom.exe
Cmd = -config %config% -savedir %savedir% -shotdir %shotdir%
#Default = gzdoom_4-14-3_uzdoom
Default = gzdoom_4-14-2

[zandronum]
Name = Zandronum
Exe = zandronum.exe
